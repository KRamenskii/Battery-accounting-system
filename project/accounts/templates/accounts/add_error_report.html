<div class="modal fade" id="errorReportModal" tabindex="-1" aria-labelledby="errorReportModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="errorReportModalLabel">Сообщить об ошибке</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="errorReportForm" method="post" action="{% url 'add_error_report' %}">
                {% csrf_token %}
                <div class="form-container scrollable-form">
                    {{ form.as_p }}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        Отправить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
