{% extends 'base.html' %}

{% block title %}Редактировать тип АБ{% endblock %}

{% block content %}

<div class="add-container">
    <h3 class="add-container-header-title">Редактировать тип АБ</h3>
    <form method="post" class="scrollable-form">
        {% csrf_token %}
        <div class="form-container">
            {{ form.as_p }}
        </div>
        <div class="button-container">
            <button class="battery-type-detail-btn back-btn" type="button" onclick="window.history.back();">Назад</button>
            <button class="battery-type-detail-btn update-btn" type="submit">Обновить</button>
        </div> 
    </form>
</div>

{% endblock %}
