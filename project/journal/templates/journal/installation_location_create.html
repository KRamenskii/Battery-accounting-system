{% extends 'base.html' %}

{% block title %}Новое место установки{% endblock %}

{% block content %}
<div class="add-container">
    <h3 class="add-container-header-title">Добавить новое место установки</h1>
    <form method="post" class="scrollable-form" action="?next={{ next_param|urlencode }}">
        {% csrf_token %}
        <div class="form-container scrollable-form">
            {{ form.as_p }}
        </div>
        <div class="button-container">
            <button class="battery-type-detail-btn back-btn" type="button" onclick="window.history.back();">Назад</button>
            <button class="battery-type-detail-btn update-btn" type="submit">Добавить</button>
        </div>
    </form>
</div>
{% endblock %}
