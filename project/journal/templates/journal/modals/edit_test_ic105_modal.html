<div class="modal fade" id="editTestIc105Modal" tabindex="-1" aria-labelledby="editTestIc105ModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editTestIc105ModalLabel">Редактирование тестирования IC105</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <form id="editTestIc105Form" method="post">
                {% csrf_token %}
                <input type="hidden" id="editTestIc105Id" name="test_id" value="">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editTestingDateIc" class="form-label fw-bold">Дата тестирования</label>
                        <input type="date" id="editTestingDateIc" name="testing_date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="editSOHIc" class="form-label fw-bold">SOH, %</label>
                        <input type="number" step="0.01" id="editSOHIc" name="SOH" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="editVOLIc" class="form-label fw-bold">VOL, В</label>
                        <input type="number" step="0.01" id="editVOLIc" name="VOL" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="editRIc" class="form-label fw-bold">R, мОм</label>
                        <input type="number" step="0.01" id="editRIc" name="R" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="editSTDIc" class="form-label fw-bold">STD</label>
                        <input type="number" step="0.01" id="editSTDIc" name="STD" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="editCCAIc" class="form-label fw-bold">CCA</label>
                        <input type="number" step="0.01" id="editCCAIc" name="CCA" class="form-control" required>
                    </div>
                    <div id="editTestIc105Messages"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>
