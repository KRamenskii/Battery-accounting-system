{% extends 'base.html' %}

{% block title %}Авторизация{% endblock %}

{% block content %}
<div class="auth-container">
    <h1 class="auth-title">Система учета АКБ</h1>
    <form class="auth-form" method="post">
        {% csrf_token %}
        <input class="auth-input" type="text" name="username" placeholder="Логин">
        <input class="auth-input" type="password" name="password" placeholder="Пароль">
        <button class="auth-button" type="submit">Войти</button>
    </form>
</div>
{% endblock %}
